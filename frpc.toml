# frp client config. Server address/token come from config.env (FRP_* env vars).
# Used only when TUNNEL=frp. Players connect to <FRP_SERVER_ADDR>:<remotePort>.
serverAddr = "{{ .Envs.FRP_SERVER_ADDR }}"
serverPort = {{ .Envs.FRP_SERVER_PORT }}
auth.method = "token"
auth.token = "{{ .Envs.FRP_TOKEN }}"

[[proxies]]
name = "minecraft-java"
type = "tcp"
localIP = "127.0.0.1"
localPort = 25565
remotePort = 25565

