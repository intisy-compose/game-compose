services:
  # --- Playit.gg Tunnel (The Network "Boss") ---
  playit:
    image: ghcr.io/playit-cloud/playit-agent:latest
    container_name: playit_agent
    profiles: ["playit"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    ports:
      - "5520:5520/udp"
      - "25565:25565"
      - "19132:19132/udp"
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27015:27015/udp"
      - "7779:7779/udp"
      - "7780:7780/udp"
    environment:
      - SECRET_KEY=${PLAYIT_SECRET}

  # --- frp Tunnel (alternative to playit; needs self-hosted frps on a VPS) ---
  frp:
    image: snowdreamtech/frpc:latest
    container_name: frp_client
    profiles: ["frp"]
    restart: unless-stopped
    ports:
      - "5520:5520/udp"
      - "25565:25565"
      - "19132:19132/udp"
      - "7777:7777/udp"
      - "7778:7778/udp"
      - "27015:27015/udp"
      - "7779:7779/udp"
      - "7780:7780/udp"
    environment:
      - FRP_SERVER_ADDR=${FRP_SERVER_ADDR:-}
      - FRP_SERVER_PORT=${FRP_SERVER_PORT:-7000}
      - FRP_TOKEN=${FRP_TOKEN:-}
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro

  # --- Hytale Server ---
  hytale:
    image: deinfreu/hytale-server:experimental
    container_name: hytale_server
    profiles: ["hytale"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: "service:${TUNNEL:-playit}"
    environment:
      SERVER_IP: "0.0.0.0"
      SERVER_PORT: "5520"
      PROD: "FALSE"
      DEBUG: "FALSE"
      TZ: "Europe/Berlin"
    volumes:
      - ./hytale_data:/home/container/game

  # --- Minecraft Server ---
  minecraft:
    image: itzg/minecraft-server:java21-jdk
    container_name: minecraft_server
    profiles: ["minecraft"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: "service:${TUNNEL:-playit}"
    environment:
      EULA: "TRUE"
      # Pinned: "LATEST" jumped to 26.1.2 (needs Java 25, breaks the Iris
      # datapacks). Bump only after validating plugins.
      VERSION: "1.21.11"
      TYPE: "PAPER"
      MEMORY: "16G"
    volumes:
      - ./mc_data:/data

  # --- Ark: Survival Evolved Server ---
  ark-ase:
    image: hermsi/ark-server:latest
    container_name: ark_ase_server
    profiles: ["ark-ase"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: "service:${TUNNEL:-playit}"
    environment:
      SESSION_NAME: "Ark Server"
      SERVER_MAP: "TheIsland"
      SERVER_PASSWORD: ""
      ADMIN_PASSWORD: "changeme"
      MAX_PLAYERS: "20"
      UPDATE_ON_START: "true"
      BACKUP_ON_STOP: "true"
      PRE_UPDATE_BACKUP: "true"
      WARN_ON_STOP: "true"
      ENABLE_CROSSPLAY: "false"
      DISABLE_BATTLEYE: "false"
      GAME_CLIENT_PORT: "7777"
      UDP_SOCKET_PORT: "7778"
      RCON_PORT: "27020"
      SERVER_LIST_PORT: "27015"
      TZ: "Europe/Berlin"
    volumes:
      - ./ark_ase_data:/app

  # --- Ark: Survival Ascended Server ---
  ark-asa:
    image: acekorneya/asa_server:2_1_latest
    container_name: ark_asa_server
    profiles: ["ark-asa"]
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: "service:${TUNNEL:-playit}"
    environment:
      PUID: "1001"
      PGID: "1001"
      BATTLEEYE: "FALSE"
      RCON_ENABLED: "FALSE"
      MAP_NAME: "TheIsland_WP"
      SESSION_NAME: "Ark Ascended Server"
      SERVER_ADMIN_PASSWORD: "changeme"
      SERVER_PASSWORD: ""
      ASA_PORT: "7779"
      RCON_PORT: "27021"
      MAX_PLAYERS: "20"
      CLUSTER_ID: "cluster"
      MOD_IDS: ""
      CUSTOM_SERVER_ARGS: ""
      UPDATE_SERVER: "TRUE"
      CHECK_FOR_UPDATE_INTERVAL: "24"
      TZ: "Europe/Berlin"
    volumes:
      - ./ark_asa_data:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server/ShooterGame
    mem_limit: 16G
