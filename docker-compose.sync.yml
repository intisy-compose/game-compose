# Applied by the launcher when the data partition can't chmod (Docker Desktop on
# Windows). Every non-root game server breaks on such a bind mount, so each game
# runs on a Linux volume and a single sidecar mirrors the volumes to the folders.
services:
  minecraft:
    volumes: !override
      - mc_data:/data
    depends_on: !override
      playit:
        condition: service_started
      data-sync:
        condition: service_healthy

  hytale:
    volumes: !override
      - hytale_data:/home/container/game
    depends_on: !override
      playit:
        condition: service_started
      data-sync:
        condition: service_healthy

  ark-ase:
    volumes: !override
      - ark_ase_data:/app
    depends_on: !override
      playit:
        condition: service_started
      data-sync:
        condition: service_healthy

  ark-asa:
    volumes: !override
      - ark_asa_data:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server/ShooterGame
    depends_on: !override
      playit:
        condition: service_started
      data-sync:
        condition: service_healthy

  data-sync:
    image: alpine:latest
    container_name: games_data_sync
    restart: unless-stopped
    volumes:
      - mc_data:/mc/config
      - ./mc_data:/mc/sync
      - hytale_data:/hytale/config
      - ./hytale_data:/hytale/sync
      - ark_ase_data:/ase/config
      - ./ark_ase_data:/ase/sync
      - ark_asa_data:/asa/config
      - ./ark_asa_data:/asa/sync
    command:
      - sh
      - -c
      - |
        apk add --no-cache rsync >/dev/null
        set -f
        # Skip re-downloadable installs and temp files (images refetch these).
        EX="--exclude=paper-*.jar --exclude=libraries/ --exclude=versions/ --exclude=cache/ --exclude=.cache/ --exclude=.paper-remapped/ --exclude=.java/ --exclude=crash-reports/ --exclude=logs/ --exclude=log/ --exclude=Assets.zip --exclude=Server/ --exclude=steamapps/ --exclude=Binaries/ --exclude=Content/ --exclude=*.sync-conflict-*"
        # Into the volume: world-writable so any server uid (1000/1001/...) can
        # write the rsync-copied files. Out to the folder: no perm/owner ops.
        for g in mc hytale ase asa; do
          rsync -rt --delete --chmod=Da+rwx,Fa+rw $$EX /$$g/sync/ /$$g/config/
        done
        touch /tmp/synced
        while true; do
          for g in mc hytale ase asa; do
            rsync -rt --delete --no-perms --no-owner --no-group $$EX /$$g/config/ /$$g/sync/
          done
          sleep 30
        done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/synced"]
      interval: 10s
      timeout: 3s
      retries: 180
      start_period: 30s

volumes:
  mc_data:
    name: mc_data
  hytale_data:
    name: hytale_data
  ark_ase_data:
    name: ark_ase_data
  ark_asa_data:
    name: ark_asa_data
