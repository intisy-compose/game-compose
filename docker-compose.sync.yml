# Applied by the launcher when the data partition can't chmod (Docker Desktop on
# Windows). Every non-root game server breaks on such a bind mount, so each game
# runs on a Linux volume and a single sidecar mirrors the volumes to the folders.
services:
  minecraft:
    volumes: !override
      - mc_data:/data
    depends_on: !override
      data-sync:
        condition: service_healthy

  hytale:
    volumes: !override
      - hytale_data:/home/container/game
    depends_on: !override
      data-sync:
        condition: service_healthy

  ark-ase:
    volumes: !override
      - ark_ase_data:/app
    depends_on: !override
      data-sync:
        condition: service_healthy

  ark-asa:
    volumes: !override
      - ark_asa_data:/usr/games/.wine/drive_c/POK/Steam/steamapps/common/ARK Survival Ascended Dedicated Server/ShooterGame
    depends_on: !override
      data-sync:
        condition: service_healthy

  data-sync:
    image: alpine:latest
    container_name: games_data_sync
    restart: unless-stopped
    volumes:
      - mc_data:/mc/config
      - ./mc_data:/mc/sync
      - hytale_data:/hytale/config
      - ./hytale_data:/hytale/sync
      - ark_ase_data:/ase/config
      - ./ark_ase_data:/ase/sync
      - ark_asa_data:/asa/config
      - ./ark_asa_data:/asa/sync
      - games_sync_state:/state
    command:
      - sh
      - -c
      - |
        apk add --no-cache unison >/dev/null
        set -f
        export UNISON=/state
        umask 000
        # Ignore re-downloadable installs and temp/state (images refetch these).
        IGN="-ignore 'Name .git' -ignore 'Name *.sync-conflict-*' -ignore 'Name logs' -ignore 'Name log' -ignore 'Name cache' -ignore 'Name .cache' -ignore 'Name libraries' -ignore 'Name versions' -ignore 'Name .paper-remapped' -ignore 'Name .java' -ignore 'Name crash-reports' -ignore 'Name Assets.zip' -ignore 'Name Server' -ignore 'Name steamapps' -ignore 'Name Binaries' -ignore 'Name Content' -ignore 'Name paper-*.jar'"
        while true; do
          for g in mc hytale ase asa; do
            eval unison /$$g/config /$$g/sync -batch -prefer newer -times -perms 0 -dontchmod $$IGN >/dev/null 2>&1
          done
          touch /tmp/synced
          sleep 15
        done
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/synced"]
      interval: 10s
      timeout: 3s
      retries: 180
      start_period: 30s

volumes:
  mc_data:
    name: mc_data
  hytale_data:
    name: hytale_data
  ark_ase_data:
    name: ark_ase_data
  ark_asa_data:
    name: ark_asa_data
  games_sync_state:
    name: games_sync_state
